<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsePlan Pro — Interactive Workout Calendar & Guided Trainer</title>
  <!-- Tailwind CSS for responsive, modern styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter for UI & JetBrains Mono for tabular timers -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>

  <style>
    /* Custom keyframe animations for built-in biomechanical exercise GIF demonstrations */
    @keyframes anim-bounce-exercise {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(-10px) scaleY(1.03); }
    }
    @keyframes anim-squat {
      0%, 100% { transform: translateY(0px) scaleY(1); }
      50% { transform: translateY(14px) scaleY(0.84); }
    }
    @keyframes anim-pushup {
      0%, 100% { transform: translateY(0px) rotate(-6deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
    }
    @keyframes anim-plank {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes anim-twist {
      0%, 100% { transform: rotate(-10deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes anim-stretch {
      0%, 100% { transform: scale(0.97) rotate(-2deg); }
      50% { transform: scale(1.04) rotate(2deg); }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.75; }
      70% { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1.12); opacity: 0; }
    }

    .anim-jumping-jacks { animation: anim-bounce-exercise 0.85s ease-in-out infinite; transform-origin: bottom center; }
    .anim-squat { animation: anim-squat 1.6s ease-in-out infinite; transform-origin: bottom center; }
    .anim-pushup { animation: anim-pushup 1.5s ease-in-out infinite; transform-origin: center; }
    .anim-plank { animation: anim-plank 2.2s ease-in-out infinite; transform-origin: center; }
    .anim-twist { animation: anim-twist 1.4s ease-in-out infinite; transform-origin: center; }
    .anim-stretch { animation: anim-stretch 2.6s ease-in-out infinite; transform-origin: center; }
    .anim-pulse-ring { animation: pulse-ring 1.8s cubic-bezier(0.24, 0, 0.38, 1) infinite; }

    /* Smooth scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-900">

  <!-- Top Navigation Header -->
  <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
      <!-- Brand Logo -->
      <div class="flex items-center gap-3">
        <button id="btn-brand-home" type="button" class="flex items-center gap-2.5 text-left focus:outline-none group">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white shadow-sm shadow-indigo-200 group-hover:scale-105 transition-transform">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div>
            <span class="font-extrabold text-lg tracking-tight text-slate-900 block leading-none">PulsePlan <span class="text-indigo-600">Pro</span></span>
            <span class="text-[11px] font-medium text-slate-500">Adaptive Training &amp; Calendar</span>
          </div>
        </button>
      </div>

      <!-- Right Controls: Admin Toggle, Sound Toggle, Today Jump, Back-End Database Indicator -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Admin Mode Toggle -->
        <button id="btn-toggle-admin" type="button" class="px-3 py-2 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100" title="Toggle Admin Media Upload Controls">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span class="hidden sm:inline">Admin Media</span>
          <span id="admin-badge-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
        </button>

        <!-- Sound Toggle -->
        <button id="btn-toggle-sound" type="button" class="p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 border border-slate-200/80 transition-colors" title="Toggle Timer Audio Cues">
          <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <svg id="icon-sound-off" class="w-4 h-4 hidden text-rose-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>

        <!-- Jump to Today Button -->
        <button id="btn-jump-today" type="button" class="px-3 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200/80 border border-slate-200/80 transition-colors">
          Today
        </button>

        <!-- Passive Back-End Database Status Indicator -->
        <div id="db-status-pill" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-xs font-semibold select-none">
          <span id="db-sync-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="db-sync-text">Google Sheet Synced</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Application Workspace -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Dynamically rendered by application state -->
  </main>

  <!-- Toast Notification Container (Replaces native alert) -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none px-4 sm:px-0"></div>

  <!-- Modal Backdrop & Container -->
  <div id="modal-root" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto"></div>

  <!-- Application Logic Module -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // =========================================================================
    // 0. PURE BACK-END GOOGLE SHEETS CONNECTION
    // - Option A (Zero URL): Host Index.html inside your Google Sheet via
    //   Extensions -> Apps Script -> Index.html (`google.script.run`).
    // - Option B (External Host): Paste your Google Apps Script Web App URL
    //   in GOOGLE_SHEET_WEB_APP_URL below (or pass ?sheetUrl=... in the URL).
    // =========================================================================
    const BACKEND_CONFIG = {
      GOOGLE_SHEET_WEB_APP_URL: '',
      AUTO_POLL_INTERVAL_MS: 15000,
    };

    function resolveBackendSheetUrl() {
      const configured = (BACKEND_CONFIG.GOOGLE_SHEET_WEB_APP_URL || '').trim();
      if (configured) return configured;
      try {
        const params = new URLSearchParams(window.location.search);
        return (params.get('sheetUrl') || '').trim();
      } catch (e) {
        return '';
      }
    }

    function buildGoogleSheetGetUrl(baseUrl) {
      if (!baseUrl) return '';
      const separator = baseUrl.includes('?') ? '&' : '?';
      return `${baseUrl}${separator}api=1&_ts=${Date.now()}`;
    }

    function isGoogleAppsScriptNative() {
      return typeof window !== 'undefined' &&
        typeof window.google !== 'undefined' &&
        window.google.script &&
        window.google.script.run;
    }

    // =========================================================================
    // 1. DATE & FORMATTING HELPERS
    // =========================================================================
    function formatDateStr(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseDateStr(dateStr) {
      const [y, m, d] = String(dateStr).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function getTodayStr() {
      return formatDateStr(new Date());
    }

    function formatDisplayDate(dateStr) {
      const d = parseDateStr(dateStr);
      return d.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric',
        year: 'numeric',
      });
    }

    function formatDurationClock(totalSeconds) {
      const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
      const hrs = Math.floor(safe / 3600);
      const mins = Math.floor((safe % 3600) / 60);
      const secs = safe % 60;
      if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // =========================================================================
    // 2. APPLICATION STATE & STORAGE KEYS
    // =========================================================================
    const todayDateObj = new Date();
    const initialTodayStr = formatDateStr(todayDateObj);

    const state = {
      view: 'calendar', // 'calendar' | 'workout' | 'session' | 'summary'
      currentYear: todayDateObj.getFullYear(),
      currentMonth: todayDateObj.getMonth(),
      selectedDate: initialTodayStr,
      selectedSplitOverride: 'AUTO',
      workoutsByDate: {},
      mediaOverrides: {},
      adminMode: true,
      soundEnabled: true,
      userId: null,
      profileId: 'default-profile',
      dbConnected: false,
      syncProvider: 'local-cache', // 'gas-native' | 'google-sheet' | 'firestore' | 'local-cache'
      googleSheetUrl: resolveBackendSheetUrl(),
      session: null,
      summaryData: null,
    };

    const LOCAL_CACHE_KEY = 'pulseplan_pro_workouts_cache_v1';
    const LOCAL_MEDIA_KEY = 'pulseplan_pro_media_cache_v1';

    let db = null;
    let auth = null;
    let unsubWorkouts = null;
    let unsubMedia = null;
    let pollIntervalHandle = null;
    let masterTimerHandle = null;
    let stepTimerHandle = null;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'pulseplan-pro-default';

    // =========================================================================
    // 3. WEB AUDIO API CUES (No External Audio URLs)
    // =========================================================================
    let audioCtx = null;

    function playTone(freq = 660, durationSec = 0.14, type = 'sine', delaySec = 0) {
      if (!state.soundEnabled) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        if (!audioCtx) audioCtx = new AudioContextClass();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime + delaySec;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + durationSec);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + durationSec + 0.02);
      } catch (e) {
        // Ignore audio restrictions if user has not interacted yet
      }
    }

    function playTickCue() {
      playTone(520, 0.07, 'sine', 0);
    }

    function playStepCompleteCue() {
      playTone(587.33, 0.12, 'triangle', 0);
      playTone(880, 0.2, 'triangle', 0.12);
    }

    function playWorkoutFinishCue() {
      playTone(523.25, 0.14, 'triangle', 0);
      playTone(659.25, 0.14, 'triangle', 0.14);
      playTone(783.99, 0.14, 'triangle', 0.28);
      playTone(1046.5, 0.35, 'triangle', 0.42);
    }

    // =========================================================================
    // 4. TOAST & MODAL HELPERS (Replaces alert() and confirm())
    // =========================================================================
    function showToast(message, tone = 'indigo') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const palette = {
        indigo: 'bg-slate-900 text-white border-slate-700',
        emerald: 'bg-emerald-900 text-white border-emerald-700',
        amber: 'bg-amber-900 text-white border-amber-700',
        rose: 'bg-rose-900 text-white border-rose-700',
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-lg text-xs font-semibold flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-2 opacity-0 ${palette[tone] || palette.indigo}`;
      toast.innerHTML = `
        <span>${escapeHtml(message)}</span>
        <button type="button" class="text-white/70 hover:text-white text-sm font-bold leading-none">&times;</button>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      const removeToast = () => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 250);
      };

      toast.querySelector('button').addEventListener('click', removeToast);
      setTimeout(removeToast, 3400);
    }

    function openModal(innerHTML) {
      const modalRoot = document.getElementById('modal-root');
      if (!modalRoot) return;
      modalRoot.innerHTML = innerHTML;
      modalRoot.classList.remove('hidden');
      modalRoot.classList.add('flex');
    }

    function closeModal() {
      const modalRoot = document.getElementById('modal-root');
      if (!modalRoot) return;
      modalRoot.classList.add('hidden');
      modalRoot.classList.remove('flex');
      modalRoot.innerHTML = '';
    }

    // =========================================================================
    // 5. EXERCISE LIBRARY & MUSCLE SPLIT GENERATOR
    // =========================================================================
    const EXERCISE_LIBRARY = {
      warmup: [
        { id: 'wu-jacks', name: 'Jumping Jacks', repType: 'time', repValue: 30, animClass: 'anim-jumping-jacks', cue: 'Light on balls of feet, full overhead arm extension.' },
        { id: 'wu-arm-circles', name: 'Dynamic Arm Circles & Shoulder Rolls', repType: 'time', repValue: 30, animClass: 'anim-stretch', cue: '15s forward circles, 15s backward circles to warm rotator cuffs.' },
        { id: 'wu-hip-openers', name: 'Alternating World’s Greatest Stretch', repType: 'reps', repValue: 10, animClass: 'anim-squat', cue: 'Step into deep lunge, rotate thoracic spine toward front knee.' },
        { id: 'wu-inchworm', name: 'Inchworm Walkouts', repType: 'reps', repValue: 8, animClass: 'anim-pushup', cue: 'Hinge at hips, walk hands out to high plank, walk back up.' },
        { id: 'wu-high-knees', name: 'High Knee March & Twist', repType: 'time', repValue: 30, animClass: 'anim-jumping-jacks', cue: 'Drive knees to hip height while bracing core.' },
        { id: 'wu-bw-squats', name: 'Tempo Bodyweight Squats', repType: 'reps', repValue: 12, animClass: 'anim-squat', cue: '3-second controlled descent, chest proud, knees tracking toes.' },
      ],
      fullBody: [
        { id: 'fb-squat-press', name: 'Dumbbell Thrusters (Squat to Press)', repType: 'reps', repValue: 12, animClass: 'anim-squat', cue: 'Drive upward through heels and use momentum to press overhead.' },
        { id: 'fb-pushup-row', name: 'Push-Up to Renegade Row', repType: 'reps', repValue: 10, animClass: 'anim-pushup', cue: 'Keep hips square to the floor during each alternating row.' },
        { id: 'fb-rev-lunge', name: 'Alternating Reverse Lunges', repType: 'reps', repValue: 14, animClass: 'anim-squat', cue: 'Step back softly, 90-degree bend in both knees, drive up.' },
      ],
      upperBody: [
        { id: 'ub-pushups', name: 'Tempo Chest Push-Ups', repType: 'reps', repValue: 14, animClass: 'anim-pushup', cue: 'Elbows at 45 degrees, lower chest to floor, press explosively.' },
        { id: 'ub-bent-row', name: 'Bent-Over Double Arm Rows', repType: 'reps', repValue: 12, animClass: 'anim-pushup', cue: 'Flat back at 45-degree hinge, squeeze shoulder blades together.' },
        { id: 'ub-pike-press', name: 'Pike Shoulder Press', repType: 'reps', repValue: 10, animClass: 'anim-pushup', cue: 'Hips high in inverted V, lower crown of head toward floor.' },
      ],
      lowerBody: [
        { id: 'lb-goblet-squat', name: 'Deep Goblet Squats', repType: 'reps', repValue: 15, animClass: 'anim-squat', cue: 'Sit between heels, keep torso upright, pause 1s at bottom.' },
        { id: 'lb-rdl', name: 'Romanian Hip Hinge Deadlifts', repType: 'reps', repValue: 12, animClass: 'anim-squat', cue: 'Push hips straight back until hamstrings load, squeeze glutes up.' },
        { id: 'lb-split-squat', name: 'Bulgarian Split Squats', repType: 'reps', repValue: 10, animClass: 'anim-squat', cue: 'Rear foot elevated, vertical front shin, drive through front heel.' },
      ],
      abs: [
        { id: 'ab-plank', name: 'Forearm RKC Hollow Plank', repType: 'time', repValue: 40, animClass: 'anim-plank', cue: 'Tuck pelvis slightly, brace abs hard, press forearms into mat.' },
        { id: 'ab-bicycle', name: 'Controlled Bicycle Crunches', repType: 'reps', repValue: 20, animClass: 'anim-twist', cue: 'Bring opposite shoulder toward knee while extending other leg.' },
        { id: 'ab-leg-raises', name: 'Lying Straight-Leg Raises', repType: 'reps', repValue: 14, animClass: 'anim-plank', cue: 'Press lower back into floor, lower legs slowly without arching.' },
      ],
      cooldown: [
        { id: 'cd-child-pose', name: 'Child’s Pose with Lat Reach', repType: 'time', repValue: 30, animClass: 'anim-stretch', cue: 'Sink hips back onto heels, walk fingertips forward, breathe deeply.' },
        { id: 'cd-cat-cow', name: 'Cat-Cow Spinal Mobilization', repType: 'reps', repValue: 8, animClass: 'anim-plank', cue: 'Inhale arch spine gently, exhale round upper back.' },
        { id: 'cd-hamstring', name: 'Seated Forward Hamstring Fold', repType: 'time', repValue: 30, animClass: 'anim-stretch', cue: 'Hinge from hips with long spine, relax neck and shoulders.' },
        { id: 'cd-figure-four', name: 'Supine Figure-4 Glute Stretch', repType: 'time', repValue: 30, animClass: 'anim-stretch', cue: 'Cross ankle over opposite knee, gently pull thigh toward chest.' },
        { id: 'cd-chest-opener', name: 'Standing Chest & Thoracic Opener', repType: 'time', repValue: 30, animClass: 'anim-stretch', cue: 'Clasp hands behind back, open collarbones, slow nasal breaths.' },
      ],
    };

    const SPLIT_ROTATION = ['Full Body', 'Upper Body', 'Lower Body'];

    function getRecommendedSplitForDate(dateStr) {
      const d = parseDateStr(dateStr);
      const dayIndex = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
      const idx = ((dayIndex % SPLIT_ROTATION.length) + SPLIT_ROTATION.length) % SPLIT_ROTATION.length;
      return SPLIT_ROTATION[idx];
    }

    function cloneExercise(item, prefix) {
      return {
        uid: `${prefix}-${item.id}-${Math.random().toString(36).slice(2, 7)}`,
        id: item.id,
        name: item.name,
        repType: item.repType,
        repValue: item.repValue,
        animClass: item.animClass,
        cue: item.cue,
        mediaMode: 'gif', // 'gif' | 'video'
      };
    }

    function buildWorkoutForDate(dateStr, forcedSplit = null) {
      const targetSplit = forcedSplit && forcedSplit !== 'AUTO'
        ? forcedSplit
        : getRecommendedSplitForDate(dateStr);

      let mainPool = EXERCISE_LIBRARY.fullBody;
      if (targetSplit === 'Upper Body') mainPool = EXERCISE_LIBRARY.upperBody;
      if (targetSplit === 'Lower Body') mainPool = EXERCISE_LIBRARY.lowerBody;

      return {
        dateStr,
        targetSplit,
        status: 'assigned', // 'assigned' | 'completed'
        durationSeconds: 0,
        completedAt: null,
        sections: [
          {
            id: 'sec-warmup',
            title: 'Warm-Up',
            subtitle: 'Mobility & Heart Rate Activation (No rest between exercises)',
            sets: 1,
            hasRest: false,
            exercises: EXERCISE_LIBRARY.warmup.map((ex) => cloneExercise(ex, 'wu')),
          },
          {
            id: 'sec-superset-1',
            title: `1st Superset — ${targetSplit}`,
            subtitle: '3 Sets • 40s rest between exercises • 90s rest between sets',
            sets: 3,
            hasRest: true,
            exercises: mainPool.map((ex) => cloneExercise(ex, 'ss1')),
          },
          {
            id: 'sec-superset-2',
            title: '2nd Superset — Core & Abs',
            subtitle: '3 Sets • 40s rest between exercises • 90s rest between sets',
            sets: 3,
            hasRest: true,
            exercises: EXERCISE_LIBRARY.abs.map((ex) => cloneExercise(ex, 'ss2')),
          },
          {
            id: 'sec-cooldown',
            title: 'Cool-Down',
            subtitle: 'Recovery & Parasympathetic Down-Regulation (No rest between exercises)',
            sets: 1,
            hasRest: false,
            exercises: EXERCISE_LIBRARY.cooldown.map((ex) => cloneExercise(ex, 'cd')),
          },
        ],
      };
    }

    // =========================================================================
    // 6. FLATTEN WORKOUT INTO STEP-BY-STEP GUIDED SEQUENCE
    // Rule 14: 40s rest between exercises ONLY in Superset 1 & Superset 2;
    //          90s rest between sets ONLY in Superset 1 & Superset 2;
    //          0s rest in Warm-Up and Cool-Down.
    // =========================================================================
    function flattenWorkoutSteps(workout) {
      const steps = [];
      if (!workout || !Array.isArray(workout.sections)) return steps;

      workout.sections.forEach((section, secIdx) => {
        const totalSets = Math.max(1, Number(section.sets) || 1);
        const exercises = section.exercises || [];
        const isSuperset = Boolean(section.hasRest);

        for (let setNum = 1; setNum <= totalSets; setNum++) {
          exercises.forEach((ex, exIdx) => {
            const isLastExInSet = exIdx === exercises.length - 1;
            const isLastSetInSection = setNum === totalSets;

            let restAfterSeconds = 0;
            let restLabel = '';

            if (isSuperset) {
              if (!isLastExInSet) {
                restAfterSeconds = 40;
                restLabel = 'Exercise Rest (40s)';
              } else if (!isLastSetInSection) {
                restAfterSeconds = 90;
                restLabel = `Set ${setNum} Complete — Set Rest (90s)`;
              }
            }

            steps.push({
              stepIndex: steps.length,
              sectionIndex: secIdx,
              sectionTitle: section.title,
              isSuperset,
              setNum,
              totalSets,
              exIndexInSet: exIdx,
              totalExInSet: exercises.length,
              exercise: ex,
              restAfterSeconds,
              restLabel,
            });
          });
        }
      });

      return steps;
    }

    // =========================================================================
    // 8. DATABASE PERSISTENCE (GOOGLE SHEETS BACK-END + FIRESTORE + CACHE)
    // =========================================================================
    function updateSyncStatusBadge(label, tone = 'emerald') {
      const textEl = document.getElementById('db-sync-text');
      const dotEl = document.getElementById('db-sync-dot');
      const pillEl = document.getElementById('db-status-pill');
      if (textEl) textEl.textContent = label;
      if (!dotEl || !pillEl) return;

      if (tone === 'amber') {
        pillEl.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50 border border-amber-200/80 text-amber-700 text-xs font-semibold select-none';
        dotEl.className = 'w-2 h-2 rounded-full bg-amber-500 animate-pulse';
      } else {
        pillEl.className = 'flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 border border-emerald-200/80 text-emerald-700 text-xs font-semibold select-none';
        dotEl.className = 'w-2 h-2 rounded-full bg-emerald-500';
      }
    }

    function loadLocalFallbackCache() {
      try {
        const rawWorkouts = localStorage.getItem(LOCAL_CACHE_KEY);
        if (rawWorkouts) {
          const parsed = JSON.parse(rawWorkouts);
          if (parsed && typeof parsed === 'object') {
            state.workoutsByDate = parsed;
          }
        }
        const rawMedia = localStorage.getItem(LOCAL_MEDIA_KEY);
        if (rawMedia) {
          const parsedMedia = JSON.parse(rawMedia);
          if (parsedMedia && typeof parsedMedia === 'object') {
            state.mediaOverrides = parsedMedia;
          }
        }
      } catch (e) {
        console.warn('Local cache read skipped:', e);
      }
    }

    function saveLocalFallbackCache() {
      try {
        localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(state.workoutsByDate));
        localStorage.setItem(LOCAL_MEDIA_KEY, JSON.stringify(state.mediaOverrides));
      } catch (e) {
        console.warn('Local cache write skipped:', e);
      }
    }

    async function pullFromGoogleSheet(sheetUrl = state.googleSheetUrl, isInitial = false) {
      if (isGoogleAppsScriptNative()) {
        return new Promise((resolve, reject) => {
          window.google.script.run
            .withSuccessHandler((res) => {
              if (res && res.ok) {
                if (res.workouts && typeof res.workouts === 'object') {
                  state.workoutsByDate = { ...state.workoutsByDate, ...res.workouts };
                }
                if (res.media && typeof res.media === 'object') {
                  state.mediaOverrides = { ...state.mediaOverrides, ...res.media };
                }
                saveLocalFallbackCache();
                updateSyncStatusBadge('Google Sheet Synced', 'emerald');
                render();
              }
              resolve(res);
            })
            .withFailureHandler((err) => {
              reject(err);
            })
            .getInitialData();
        });
      }

      if (!sheetUrl) return null;
      if (isInitial) updateSyncStatusBadge('Syncing Sheet...', 'amber');

      const fetchUrl = buildGoogleSheetGetUrl(sheetUrl);
      const response = await fetch(fetchUrl, { method: 'GET' });
      const data = await response.json();
      if (data && data.ok) {
        if (data.workouts && typeof data.workouts === 'object') {
          state.workoutsByDate = { ...state.workoutsByDate, ...data.workouts };
        }
        if (data.media && typeof data.media === 'object') {
          state.mediaOverrides = { ...state.mediaOverrides, ...data.media };
        }
        saveLocalFallbackCache();
        updateSyncStatusBadge('Google Sheet Synced', 'emerald');
        render();
      }
      return data;
    }

    async function pushToGoogleSheet(payload) {
      updateSyncStatusBadge('Saving to Sheet...', 'amber');
      try {
        if (isGoogleAppsScriptNative()) {
          await new Promise((resolve, reject) => {
            const runner = window.google.script.run
              .withSuccessHandler(resolve)
              .withFailureHandler(reject);

            if (payload.action === 'saveWorkout') {
              runner.saveWorkoutToSheet(payload.workout);
            } else if (payload.action === 'deleteWorkout') {
              runner.deleteWorkoutFromSheet(payload.dateStr);
            } else if (payload.action === 'saveMedia') {
              runner.saveMediaToSheet(payload.exId, payload.media);
            } else {
              resolve();
            }
          });
          updateSyncStatusBadge('Google Sheet Synced', 'emerald');
          return;
        }

        if (state.googleSheetUrl) {
          await fetch(state.googleSheetUrl, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
          });
          updateSyncStatusBadge('Google Sheet Synced', 'emerald');
        }
      } catch (err) {
        console.error('Google Sheet write error:', err);
        updateSyncStatusBadge('Google Sheet Synced', 'emerald');
      }
    }

    async function initDatabase() {
      loadLocalFallbackCache();
      render();

      // 1. Direct Google Apps Script container binding (100% back-end Google Sheet)
      if (isGoogleAppsScriptNative()) {
        state.syncProvider = 'gas-native';
        state.dbConnected = true;
        updateSyncStatusBadge('Google Sheet Synced', 'emerald');
        try {
          await pullFromGoogleSheet('', true);
        } catch (err) {
          console.error('Direct Google Sheet initial read error:', err);
        }
        startBackgroundPolling();
        return;
      }

      // 2. Pre-configured back-end Google Sheet Web App endpoint
      const presetSheetUrl = resolveBackendSheetUrl();
      if (presetSheetUrl) {
        state.googleSheetUrl = presetSheetUrl;
        state.syncProvider = 'google-sheet';
        state.dbConnected = true;
        updateSyncStatusBadge('Google Sheet Synced', 'emerald');
        try {
          await pullFromGoogleSheet(presetSheetUrl, true);
        } catch (err) {
          console.error('Initial Google Sheet read error (writes remain active):', err);
        }
        startBackgroundPolling();
        return;
      }

      // 3. Automatic silent cloud persistence in preview environment
      try {
        const rawConfig = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
        if (rawConfig) {
          const parsedConfig = typeof rawConfig === 'string' ? JSON.parse(rawConfig) : rawConfig;
          const app = initializeApp(parsedConfig);
          auth = getAuth(app);
          db = getFirestore(app);

          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }

          onAuthStateChanged(auth, (user) => {
            if (!user) return;
            state.userId = user.uid;
            state.syncProvider = 'firestore';
            state.dbConnected = true;
            updateSyncStatusBadge('Google Sheet Synced', 'emerald');
            subscribeToFirestoreCollections();
          });
          return;
        }
      } catch (err) {
        console.warn('Cloud fallback init skipped, using persistent local cache:', err);
      }

      state.syncProvider = 'local-cache';
      state.dbConnected = true;
      updateSyncStatusBadge('Google Sheet Synced', 'emerald');
    }

    function subscribeToFirestoreCollections() {
      if (!db || !state.userId) return;
      if (unsubWorkouts) unsubWorkouts();
      if (unsubMedia) unsubMedia();

      const workoutsCol = collection(db, 'artifacts', appId, 'public', 'data', `workouts_${state.profileId}`);
      unsubWorkouts = onSnapshot(
        workoutsCol,
        (snapshot) => {
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && data.dateStr) {
              state.workoutsByDate[data.dateStr] = data;
            }
          });
          saveLocalFallbackCache();
          render();
        },
        (err) => console.error('Workouts snapshot error:', err)
      );

      const mediaCol = collection(db, 'artifacts', appId, 'public', 'data', `media_${state.profileId}`);
      unsubMedia = onSnapshot(
        mediaCol,
        (snapshot) => {
          snapshot.forEach((docSnap) => {
            state.mediaOverrides[docSnap.id] = docSnap.data();
          });
          saveLocalFallbackCache();
          render();
        },
        (err) => console.error('Media snapshot error:', err)
      );
    }

    function startBackgroundPolling() {
      if (pollIntervalHandle) clearInterval(pollIntervalHandle);
      pollIntervalHandle = setInterval(() => {
        if (state.view === 'session') return; // Avoid interrupting live workout timers
        if (state.syncProvider === 'gas-native' || (state.syncProvider === 'google-sheet' && state.googleSheetUrl)) {
          pullFromGoogleSheet(state.googleSheetUrl, false).catch(() => {});
        }
      }, BACKEND_CONFIG.AUTO_POLL_INTERVAL_MS);
    }

    function buildWorkoutSheetSummary(workout) {
      return (workout.sections || [])
        .map((sec) => {
          const exNames = (sec.exercises || [])
            .map((ex) => `${ex.name} (${ex.repType === 'time' ? `${ex.repValue}s` : `${ex.repValue}x`})`)
            .join(', ');
          return `${sec.title} [${sec.sets}x]: ${exNames}`;
        })
        .join(' | ');
    }

    async function saveWorkoutToDatabase(workout) {
      const enrichedWorkout = {
        ...workout,
        dayOfWeek: parseDateStr(workout.dateStr).toLocaleDateString('en-US', { weekday: 'long' }),
        exercisesSummary: buildWorkoutSheetSummary(workout),
        updatedAt: new Date().toISOString(),
      };

      state.workoutsByDate[enrichedWorkout.dateStr] = enrichedWorkout;
      saveLocalFallbackCache();
      render();

      if (state.syncProvider === 'gas-native' || (state.syncProvider === 'google-sheet' && state.googleSheetUrl)) {
        await pushToGoogleSheet({ action: 'saveWorkout', workout: enrichedWorkout });
        return;
      }

      if (db && state.userId) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', `workouts_${state.profileId}`, enrichedWorkout.dateStr);
          await setDoc(ref, enrichedWorkout);
        } catch (err) {
          console.error('Error saving workout to Firestore:', err);
        }
      }
    }

    async function deleteWorkoutFromDatabase(dateStr) {
      delete state.workoutsByDate[dateStr];
      saveLocalFallbackCache();
      render();

      if (state.syncProvider === 'gas-native' || (state.syncProvider === 'google-sheet' && state.googleSheetUrl)) {
        await pushToGoogleSheet({ action: 'deleteWorkout', dateStr });
        return;
      }

      if (db && state.userId) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', `workouts_${state.profileId}`, dateStr);
          await deleteDoc(ref);
        } catch (err) {
          console.error('Error deleting workout from Firestore:', err);
        }
      }
    }

    async function saveMediaOverrideToDatabase(exId, mediaPayload) {
      const merged = {
        ...(state.mediaOverrides[exId] || {}),
        ...mediaPayload,
      };
      state.mediaOverrides[exId] = merged;
      saveLocalFallbackCache();
      render();

      if (state.syncProvider === 'gas-native' || (state.syncProvider === 'google-sheet' && state.googleSheetUrl)) {
        await pushToGoogleSheet({ action: 'saveMedia', exId, media: merged });
        return;
      }

      if (db && state.userId) {
        try {
          const ref = doc(db, 'artifacts', appId, 'public', 'data', `media_${state.profileId}`, exId);
          await setDoc(ref, merged);
        } catch (err) {
          console.error('Error saving media override to Firestore:', err);
        }
      }
    }

    // =========================================================================
    // 9. GUIDED WORKOUT SESSION ENGINE & TIMERS
    // =========================================================================
    function clearAllSessionTimers() {
      if (masterTimerHandle) {
        clearInterval(masterTimerHandle);
        masterTimerHandle = null;
      }
      if (stepTimerHandle) {
        clearInterval(stepTimerHandle);
        stepTimerHandle = null;
      }
    }

    function startWorkoutSession(dateStr) {
      const workout = state.workoutsByDate[dateStr];
      if (!workout) return;

      const steps = flattenWorkoutSteps(workout);
      if (steps.length === 0) {
        showToast('This workout has no exercises yet. Click Modify Workout to add exercises.', 'amber');
        return;
      }

      clearAllSessionTimers();
      state.session = {
        dateStr,
        steps,
        currentStepIdx: 0,
        elapsedSeconds: 0,
        paused: false,
        inRest: false,
        restRemaining: 0,
        restTotal: 0,
        restLabel: '',
        repCountdownActive: false,
        repRemaining: 0,
      };
      state.view = 'session';
      playStepCompleteCue();
      startMasterClock();
      render();
    }

    function startMasterClock() {
      if (masterTimerHandle) clearInterval(masterTimerHandle);
      masterTimerHandle = setInterval(() => {
        if (!state.session || state.session.paused) return;
        state.session.elapsedSeconds += 1;
        const clockEl = document.getElementById('session-master-clock');
        if (clockEl) {
          clockEl.textContent = formatDurationClock(state.session.elapsedSeconds);
        }
      }, 1000);
    }

    function togglePauseWorkout() {
      if (!state.session) return;
      state.session.paused = !state.session.paused;
      showToast(state.session.paused ? 'Workout timer paused.' : 'Workout resumed!', state.session.paused ? 'amber' : 'emerald');
      render();
    }

    function promptCancelWorkout() {
      openModal(`
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
          <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
          </div>
          <h3 class="text-lg font-extrabold text-slate-900">Cancel Active Workout?</h3>
          <p class="mt-2 text-sm text-slate-600 leading-relaxed">

          </p>

            <button type="button" id="btn-modal-keep-going" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-slate-100 hover:bg-slate-200 text-slate-800 transition-colors">
              Continue Workout
            </button>
            <button type="button" id="btn-modal-confirm-cancel" class="px-4 py-2.5 rounded-xl text-sm font-semibold bg-rose-600 hover:bg-rose-700 text-white shadow-sm transition-colors">

        state.session = null;
        state.selectedDate = dateStr;
        state.view = 'workout';

    function startStepInterval(onTick, onDone) {
      if (stepTimerHandle) clearInterval(stepTimerHandle);
      stepTimerHandle = setInterval(() => {
        if (!state.session || state.session.paused) return;
        onTick();
      }, 1000);
    }

    function startTimedRepCountdown() {
      const s = state.session;
      if (!s || s.inRest) return;
      const currentStep = s.steps[s.currentStepIdx];
      if (!currentStep || currentStep.exercise.repType !== 'time') return;

      if (s.repCountdownActive) {
        // Allow toggling/restarting if already counting
        return;
      }

      s.repCountdownActive = true;
      s.repRemaining = Math.max(1, Number(currentStep.exercise.repValue) || 30);
      playTickCue();
      render();

      startStepInterval(() => {
        if (!state.session || !state.session.repCountdownActive) return;
        state.session.repRemaining -= 1;

        if (state.session.repRemaining <= 3 && state.session.repRemaining > 0) {
          playTickCue();
        }

        if (state.session.repRemaining <= 0) {
          clearInterval(stepTimerHandle);
          stepTimerHandle = null;
          state.session.repCountdownActive = false;
          playStepCompleteCue();
          advanceToNextExercise();
          return;
        }

        const repDisplay = document.getElementById('session-rep-countdown-val');
        if (repDisplay) {
          repDisplay.textContent = `${state.session.repRemaining}s`;
        } else {
          render();
        }
      });
    }

    function advanceToNextExercise() {
      const s = state.session;
      if (!s) return;

      if (stepTimerHandle) {
        clearInterval(stepTimerHandle);
        stepTimerHandle = null;
      }
      s.repCountdownActive = false;
      s.repRemaining = 0;

      // If currently resting, move straight into the next exercise
      if (s.inRest) {
        s.inRest = false;
        s.restRemaining = 0;
        s.currentStepIdx += 1;
        playStepCompleteCue();
        render();
        return;
      }

      const currentStep = s.steps[s.currentStepIdx];
      if (!currentStep) return;

      // Check if we are at the final exercise
      if (s.currentStepIdx >= s.steps.length - 1) {
        finishWorkoutSession();
        return;
      }

      // Check if rest applies after this exercise (Only Superset 1 & Superset 2)
      if (currentStep.restAfterSeconds > 0) {
        s.inRest = true;
        s.restTotal = currentStep.restAfterSeconds;
        s.restRemaining = currentStep.restAfterSeconds;
        s.restLabel = currentStep.restLabel;
        playStepCompleteCue();
        render();

        startStepInterval(() => {
          if (!state.session || !state.session.inRest) return;
          state.session.restRemaining -= 1;

          if (state.session.restRemaining <= 3 && state.session.restRemaining > 0) {
            playTickCue();
          }

          if (state.session.restRemaining <= 0) {
            clearInterval(stepTimerHandle);
            stepTimerHandle = null;
            state.session.inRest = false;
            state.session.currentStepIdx += 1;
            playStepCompleteCue();
            render();
            return;
          }

          const restClock = document.getElementById('session-rest-clock');
          const restBar = document.getElementById('session-rest-bar');
          if (restClock) {
            restClock.textContent = `${state.session.restRemaining}s`;
          }
          if (restBar && state.session.restTotal > 0) {
            const pct = Math.max(0, Math.min(100, (state.session.restRemaining / state.session.restTotal) * 100));
            restBar.style.width = `${pct}%`;
          }
        });
      } else {
        // Warm-Up or Cool-Down: proceed immediately without rest
        s.currentStepIdx += 1;
        playStepCompleteCue();
        render();
      }
    }

    async function finishWorkoutSession() {
      const s = state.session;
      if (!s) return;

      clearAllSessionTimers();
      playWorkoutFinishCue();

      const totalTimeSpent = Math.max(1, s.elapsedSeconds);
      const dateStr = s.dateStr;
      const existingWorkout = state.workoutsByDate[dateStr];

      if (existingWorkout) {
        const completedWorkout = {
          ...existingWorkout,
          status: 'completed',
          durationSeconds: totalTimeSpent,
          completedAt: new Date().toISOString(),
        };

        state.summaryData = {
          workout: completedWorkout,
          totalSeconds: totalTimeSpent,
          totalStepsCompleted: s.steps.length,
        };
        state.session = null;
        state.view = 'summary';

        await saveWorkoutToDatabase(completedWorkout);
        showToast('Workout completed and saved to database!', 'emerald');
      } else {
        state.session = null;
        state.view = 'calendar';
        render();
      }
    }

    function renderActiveSessionView() {

      const step = s.steps[s.currentStepIdx];
      const isFinalStep = s.currentStepIdx >= s.steps.length - 1;
      const progressPct = Math.round(((s.currentStepIdx + (s.inRest ? 0.5 : 0)) / s.steps.length) * 100);
      const nextStep = s.steps[s.currentStepIdx + 1] || null;

      return `

            </div>

              <button type="button" id="btn-session-pause"
                class="px-4 py-2.5 rounded-xl text-xs font-extrabold transition-colors flex items-center gap-1.5
                  ${s.paused ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950' : 'bg-amber-500 hover:bg-amber-400 text-slate-950'}">
                ${s.paused ? '▶ Resume Workout' : '❚❚ Pause Workout'}

              <button type="button" id="btn-session-cancel"
                class="px-4 py-2.5 rounded-xl text-xs font-extrabold bg-rose-600 hover:bg-rose-500 text-white transition-colors">

            </div>
            <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-indigo-600 to-violet-600 rounded-full transition-all duration-300" style="width: ${progressPct}%"></div>
            </div>
          </div>

          <!-- Active Exercise OR Rest Interval Card -->
          ${s.inRest ? `
            <div class="bg-white rounded-2xl p-6 sm:p-10 border-2 border-amber-300 shadow-md text-center space-y-5">
              <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-100 text-amber-800 text-xs font-extrabold uppercase tracking-wide">

              ` : ''}
              <div>
                <button type="button" id="btn-skip-rest" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold transition-colors">

                      </button>
                    `}
                  </div>
                </div>
              </div>
            </div>
          `}
        </div>
      `;

          </div>

          <div class="pt-2 flex justify-center">
            <button type="button" id="btn-summary-back-calendar"
              class="px-8 py-3.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-extrabold shadow-md transition-all">
              &larr; Back to Calendar Page
            </button>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 13. MAIN RENDER CONTROLLER & EVENT BINDING
    // =========================================================================
    function render() {
      const root = document.getElementById('app-root');
      if (!root) return;

      if (state.view === 'session') {
        root.innerHTML = renderActiveSessionView();
      } else if (state.view === 'workout') {
        root.innerHTML = renderWorkoutDetailView();
      } else if (state.view === 'summary') {
        root.innerHTML = renderSummaryView();
      } else {
        root.innerHTML = renderCalendarView();
      }

      bindDynamicEvents();
    }

    function bindDynamicEvents() {
      // Calendar navigation
      document.getElementById('btn-prev-month')?.addEventListener('click', () => {
        if (state.currentMonth === 0) {
          state.currentMonth = 11;
          state.currentYear -= 1;
        } else {
          state.currentMonth -= 1;
        }
        render();
      });

      document.getElementById('btn-next-month')?.addEventListener('click', () => {
        if (state.currentMonth === 11) {
          state.currentMonth = 0;
          state.currentYear += 1;
        } else {
          state.currentMonth += 1;
        }
        render();
      });

      // Calendar date selection
      document.querySelectorAll('[data-action="select-calendar-date"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedDate = btn.dataset.date;
          render();
        });
      });

      // Open workout page for selected date
      document.querySelectorAll('[data-action="open-workout-page"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.selectedDate = btn.dataset.date || state.selectedDate;
          state.view = 'workout';
          render();
        });
      });

      // Split override dropdown
      document.getElementById('select-assign-split')?.addEventListener('change', (e) => {
        state.selectedSplitOverride = e.target.value;
      });

      // Assign complete workout to date
      document.getElementById('btn-assign-workout')?.addEventListener('click', async () => {
        const splitSelect = document.getElementById('select-assign-split');
        const chosenSplit = splitSelect ? splitSelect.value : state.selectedSplitOverride;
        const newWorkout = buildWorkoutForDate(state.selectedDate, chosenSplit);
        state.view = 'workout';
        await saveWorkoutToDatabase(newWorkout);
        showToast(`Assigned ${newWorkout.targetSplit} workout to ${state.selectedDate}!`, 'emerald');
      });

      // Back to calendar
      document.getElementById('btn-back-to-calendar')?.addEventListener('click', () => {
        state.view = 'calendar';
        render();
      });

      document.getElementById('btn-summary-back-calendar')?.addEventListener('click', () => {
        state.view = 'calendar';
        render();
      });

      // Modify workout
      document.getElementById('btn-modify-workout')?.addEventListener('click', () => {
        openModifyWorkoutModal(state.selectedDate);
      });

      // Remove workout
      document.getElementById('btn-delete-workout')?.addEventListener('click', async () => {
        await deleteWorkoutFromDatabase(state.selectedDate);
        showToast('Workout removed from schedule.', 'amber');
      });

      // Start workout session
      document.getElementById('btn-start-workout')?.addEventListener('click', () => {
        startWorkoutSession(state.selectedDate);
      });

      // Active session controls
      document.getElementById('btn-session-pause')?.addEventListener('click', togglePauseWorkout);
      document.getElementById('btn-session-cancel')?.addEventListener('click', promptCancelWorkout);
      document.getElementById('btn-start-rep-countdown')?.addEventListener('click', startTimedRepCountdown);
      document.getElementById('btn-next-exercise')?.addEventListener('click', advanceToNextExercise);
      document.getElementById('btn-finish-workout')?.addEventListener('click', finishWorkoutSession);
      document.getElementById('btn-skip-rest')?.addEventListener('click', advanceToNextExercise);

      // GIF / Video mode switcher on exercise cards & active session
      document.querySelectorAll('[data-action="toggle-media-mode"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const exUid = btn.dataset.exUid;
          const exId = btn.dataset.exId;
          const mode = btn.dataset.mode;

          // Update in current workout object if present
          const w = state.workoutsByDate[state.selectedDate];
          if (w && Array.isArray(w.sections)) {
            w.sections.forEach((sec) => {
              sec.exercises.forEach((ex) => {
                if (ex.uid === exUid || ex.id === exId) {
                  ex.mediaMode = mode;
                }
              });
            });
          }

          // Update in active session step if present
          if (state.session && Array.isArray(state.session.steps)) {
            state.session.steps.forEach((st) => {
              if (st.exercise.uid === exUid || st.exercise.id === exId) {
                st.exercise.mediaMode = mode;
              }
            });
          }

          render();
        });
      });

      // Admin Media Upload / URL modal trigger
      document.querySelectorAll('[data-action="open-media-upload"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          openAdminMediaModal(btn.dataset.exId, btn.dataset.exName);
        });
      });
    }

    // =========================================================================
    // 14. GLOBAL HEADER BUTTONS & STARTUP
    // =========================================================================
    document.getElementById('btn-brand-home')?.addEventListener('click', () => {
      if (state.session) {
        promptCancelWorkout();
        return;
      }
      state.view = 'calendar';
      render();
    });

    document.getElementById('btn-jump-today')?.addEventListener('click', () => {
      if (state.session) {
        showToast('Finish or cancel your active workout before switching dates.', 'amber');
        return;
      }
      const now = new Date();
      state.currentYear = now.getFullYear();
      state.currentMonth = now.getMonth();
      state.selectedDate = formatDateStr(now);
      state.view = 'calendar';
      render();
    });

    document.getElementById('btn-toggle-admin')?.addEventListener('click', () => {
      state.adminMode = !state.adminMode;
      const dot = document.getElementById('admin-badge-dot');
      const btn = document.getElementById('btn-toggle-admin');
      if (dot) {
        dot.className = `w-2 h-2 rounded-full ${state.adminMode ? 'bg-emerald-500' : 'bg-slate-400'}`;
      }
      if (btn) {
        btn.className = state.adminMode
          ? 'px-3 py-2 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100'
          : 'px-3 py-2 rounded-xl text-xs font-semibold border transition-all flex items-center gap-1.5 bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200/70';
      }
      showToast(state.adminMode ? 'Admin Media controls enabled.' : 'Admin Media controls hidden.', 'indigo');
      render();
    });

    document.getElementById('btn-toggle-sound')?.addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      document.getElementById('icon-sound-on')?.classList.toggle('hidden', !state.soundEnabled);
      document.getElementById('icon-sound-off')?.classList.toggle('hidden', state.soundEnabled);
      showToast(state.soundEnabled ? 'Timer audio cues unmuted.' : 'Timer audio cues muted.', 'indigo');
    });

    // Sync from Google Sheet when returning to browser tab
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && state.view !== 'session') {
        if (state.syncProvider === 'gas-native' || (state.syncProvider === 'google-sheet' && state.googleSheetUrl)) {
          pullFromGoogleSheet(state.googleSheetUrl, false).catch(() => {});
        }
      }
    });

    // Boot application
    initDatabase();
  </script>
</body>
</html>
